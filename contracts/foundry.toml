[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[profile.default.fuzz]
runs = 256

# Stateful suites in test/invariant: 7 invariants x 64 x 250 = 112k calls per `forge test`.
# FOUNDRY_PROFILE=deep forge test --match-path "test/invariant/*" for 7 x 128k.
[profile.default.invariant]
runs = 64
depth = 250

[profile.deep.invariant]
runs = 256
depth = 500
