# Phala Cloud CVM for core (evaluator, executor/signer, Fair Copy, tester). The dstack socket
# gives KMS-derived keys and TDX quotes. The image is pinned by digest so the attested compose
# hash names exact code (built by .github/workflows/images.yml from the public repo).
# The networks are literals, so they are measured; the other values come from Phala's encrypted
# environment (only names appear here). The RPC host is pinned in code (@proviso/chain rhcRpcUrl).
services:
  core:
    image: ghcr.io/provisofi/proviso-core@sha256:c7da17c90b90c8126a0715d41da30b96a5d66f34e5c106beb610cc3f513a98d0
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHAIN_NETWORK=mainnet
      - HL_NETWORK=mainnet
      - TESTNET_MIN_HL_VOLUME_USD=1000
      - RHC_RPC_KEY=${RHC_RPC_KEY}
      - HL_PERPS_BUILDER=${HL_PERPS_BUILDER}
      - HL_SPOT_BUILDER=${HL_SPOT_BUILDER}
