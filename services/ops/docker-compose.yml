# Phala Cloud CVM for ops (stamper relay, reveals, roots, sweep, epochs, notify, Telegram,
# X poller, feed pusher, market recorder). Image pinned by digest; values come from Phala's
# encrypted environment, only names appear here.
services:
  ops:
    image: ghcr.io/provisofi/proviso-ops@sha256:f7b59929fe9fccfdda3ae632660ca997f7fd9d4c441e9ee48b7f2da7b889c25f
    restart: always
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHAIN_NETWORK=testnet
      - HL_NETWORK=testnet
      - TESTNET_MIN_HL_VOLUME_USD=1000
      - SNAPSHOT_INTERVAL_MS=60000
      - RHC_RPC_URL=${RHC_RPC_URL}
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - CONTRACTS_DEPLOY_BLOCK=${CONTRACTS_DEPLOY_BLOCK}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - X_BEARER_TOKEN=${X_BEARER_TOKEN}
      - TEST_FEEDS=${TEST_FEEDS}
      - TEST_FEEDS_MODE=${TEST_FEEDS_MODE}
      - FEED_MIN_ETH=${FEED_MIN_ETH}
      - EPOCH_POOL_USDG=${EPOCH_POOL_USDG}
