# Phala Cloud CVM for ops (stamper relay, reveals, roots, sweep, epochs, notify, Telegram,
# X poller, feed pusher, market recorder). Image pinned by digest; the networks are literals, the
# other values come from Phala's encrypted environment (only names appear here). The RPC host is
# pinned in code (@proviso/chain rhcRpcUrl).
services:
  ops:
    image: ghcr.io/provisofi/proviso-ops@sha256:e4135b6bd925b5d2c6b688190d3576edd81778e7235fde6825455b574633bc4e
    restart: always
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHAIN_NETWORK=mainnet
      - HL_NETWORK=mainnet
      - TESTNET_MIN_HL_VOLUME_USD=1000
      - SNAPSHOT_INTERVAL_MS=60000
      - RHC_RPC_KEY=${RHC_RPC_KEY}
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - CONTRACTS_DEPLOY_BLOCK=${CONTRACTS_DEPLOY_BLOCK}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - X_BEARER_TOKEN=${X_BEARER_TOKEN}
      - TEST_FEEDS=${TEST_FEEDS}
      - TEST_FEEDS_MODE=${TEST_FEEDS_MODE}
      - FEED_MIN_ETH=${FEED_MIN_ETH}
      - RELAYER_ALERT_ADDRESS=${RELAYER_ALERT_ADDRESS}
      - RELAYER_MIN_ETH=${RELAYER_MIN_ETH}
      - RELAYER_DAILY_USER_BUDGET_ETH=0.005
      - EPOCH_POOL_USDG=${EPOCH_POOL_USDG}
