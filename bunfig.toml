# Supply-chain controls for every `bun install` in this repo (local, CI, Docker, Vercel).
[install]
# Refuse to resolve any npm version published less than 7 days ago (seconds).
# Already-locked versions in bun.lock are unaffected; this gates upgrades and new deps.
minimumReleaseAge = 604800
# Lifecycle scripts are gated separately by "trustedDependencies" in package.json
# (an empty list: no dependency install script runs).
