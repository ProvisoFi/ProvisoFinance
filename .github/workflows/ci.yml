# Tests and static analysis on every push and pull request to main. No secrets are used:
# every test runs offline (the anvil suites start a local node; live suites skip without
# their opt-in env vars RELAY_LIVE_TESTS / HL_LIVE_TESTS). Actions are pinned to commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Install packages
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Foundry libraries (pinned commits)
        run: bash contracts/install-deps.sh

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        run: forge test

      # The anvil suites look for ~/.foundry/bin/anvil; core and ops tests read contracts/out.
      - name: Link anvil
        run: mkdir -p "$HOME/.foundry/bin" && ln -sf "$(command -v anvil)" "$HOME/.foundry/bin/anvil"

      - name: bun test (server packages)
        run: |
          for p in packages/dsl packages/seal packages/hl packages/db packages/chain packages/api services/core services/ops; do
            echo "::group::$p"
            (cd "$p" && bun test)
            echo "::endgroup::"
          done

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Build with build-info
        run: |
          bash contracts/install-deps.sh
          cd contracts && forge build --build-info --skip './test/**' './script/**'

      # arbitrary-send-erc20 is excluded after triage: ProvisoSwapAdapter.unlockCallback pulls
      # only from the account the adapter itself passed to PoolManager.unlock (msg.sender is
      # checked to be the PoolManager). Revisit if the adapter's unlock data changes.
      # Installed on the runner (not the slither-action container, which has no forge).
      - name: Slither
        run: |
          python3 -m pip install --quiet slither-analyzer==0.11.6
          cd contracts && slither . --ignore-compile --fail-high --filter-paths "lib/|test/|script/" --exclude arbitrary-send-erc20

  # Halmos symbolic proof that ProvisoSwapAdapter.setPolicy only stores policies on the pinned
  # oracle, quote and multiplier (contracts/test/halmos/AdapterPins.t.sol). The oracle-floor
  # checks in OracleBand.t.sol time out at full width and run as forge fuzz in `test` instead.
  # halmos and its yices solver are pinned; halmos runs forge build itself.
  halmos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Install Foundry libraries (pinned commits)
        run: bash contracts/install-deps.sh

      - name: Halmos
        run: |
          python3 -m pip install --quiet halmos==0.3.3 yices-solver==2.6.4.post23
          cd contracts && halmos --match-contract AdapterPinsSymTest

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install gitleaks (checksum-verified release)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks

      # Scans the checked-out tree (config: .gitleaks.toml). History is not rescanned here.
      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b # 1.181.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: semgrep (TypeScript)
        run: semgrep scan --config p/typescript --error --metrics off --exclude '*.test.ts' packages services apps/web/src
