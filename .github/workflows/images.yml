# Builds the enclave images (core, ops) from the public source so anyone can match the
# attested code to this repo. Runs only in the public repo, only from main; the private repo
# never publishes. Actions are pinned to commit SHAs (tag in the comment).
name: Build enclave images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      # Pinning a new digest in a compose file must not trigger another build.
      - "!services/**/docker-compose.yml"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read # checkout
      packages: write # push to GHCR
      id-token: write # keyless signing of the build provenance
      attestations: write # store the provenance attestation
    # A manual run from another branch must never publish or move :latest.
    if: github.repository == 'ProvisoFi/ProvisoFinance' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core, ops]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          # Plain single-platform manifest for dstack; provenance is attested below instead.
          provenance: false
          tags: |
            ghcr.io/provisofi/proviso-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/provisofi/proviso-${{ matrix.service }}:latest

      # Signed source -> digest binding (Sigstore), verifiable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/provisofi/proviso-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Deploys pin this digest, so the attested compose names exact code.
      - env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "proviso-$SERVICE digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # Vulnerability scan of the pushed digest (OS packages + JS libraries), fixable findings only.
      # Runs after the attestation, so provenance always exists; a red job means "do not pin this
      # digest". HIGH and CRITICAL go to the report artifact; only CRITICAL fails the job.
      - name: Install trivy (checksum-verified release)
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy

      - name: trivy scan
        env:
          IMAGE: ghcr.io/provisofi/proviso-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          t="$RUNNER_TEMP/trivy"
          out="$RUNNER_TEMP/trivy-$SERVICE"
          mkdir -p "$out"
          "$t" image --quiet --ignore-unfixed --pkg-types os,library --severity HIGH,CRITICAL \
            --format json --output "$out/report.json" "$IMAGE"
          "$t" convert --format sarif --output "$out/report.sarif" "$out/report.json"
          "$t" convert --format table --output "$out/report.txt" "$out/report.json"
          cat "$out/report.txt"
          "$t" convert --quiet --severity CRITICAL --exit-code 1 --format table "$out/report.json"

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-${{ matrix.service }}
          path: ${{ runner.temp }}/trivy-${{ matrix.service }}/
          if-no-files-found: ignore
