# gitleaks config for CI: the default rules plus two allowlisted false positives.
[extend]
useDefault = true

[[allowlists]]
description = "Public contract addresses and anvil's well-known dev key #0 (used only in tests)"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
]
